<svg viewBox="0 0 480 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Скошенный яркий фон -->
    <polygon points="25,170 65,35 455,25 400,190"
             fill="#ede2ff" stroke="#c2a7fa" stroke-width="10" opacity="0.85"/>
    <!-- Пузырьки -->
    <g>
      <ellipse cx="115" cy="180" rx="19" ry="15" fill="#a0046e"/>
      <ellipse cx="335" cy="55" rx="15" ry="15" fill="#a0046e"/>
      <ellipse cx="425" cy="120" rx="13" ry="13" fill="#a0046e"/>
      <ellipse cx="350" cy="155" rx="17" ry="14" fill="#a0046e"/>
      <ellipse cx="245" cy="36" rx="12" ry="10" fill="#a0046e"/>
      <ellipse cx="170" cy="155" rx="10" ry="10" fill="#a0046e"/>
      <!-- блики -->
      <ellipse cx="123" cy="170" rx="4" ry="4" fill="#fff" opacity="0.6"/>
      <ellipse cx="335" cy="48" rx="3" ry="3" fill="#fff" opacity="0.6"/>
      <ellipse cx="428" cy="112" rx="2.5" ry="2.5" fill="#fff" opacity="0.6"/>
      <ellipse cx="354" cy="147" rx="2.5" ry="2.5" fill="#fff" opacity="0.6"/>
      <ellipse cx="248" cy="30" rx="2" ry="2" fill="#fff" opacity="0.6"/>
      <ellipse cx="175" cy="150" rx="1.8" ry="1.8" fill="#fff" opacity="0.6"/>
    </g>
    <!-- Текст "Situation" -->
    <g>
      <text x="240" y="140" text-anchor="middle"
            font-family="'Permanent Marker','Arial Black','Comic Sans MS',cursive"
            font-size="60" font-weight="bold"
            fill="url(#graffitiBlue)" stroke="#43155e" stroke-width="8"
            letter-spacing="2" transform="skewX(-12) rotate(-3 240 140)">
        Situation
      </text>
      <!-- внутренняя тень -->
      <text x="240" y="140" text-anchor="middle"
            font-family="'Permanent Marker','Arial Black','Comic Sans MS',cursive"
            font-size="60" font-weight="bold"
            fill="none" stroke="#fed73a" stroke-width="3"
            letter-spacing="2" transform="skewX(-12) rotate(-3 240 140)">
        Situation
      </text>
      <!-- Подтёки -->
      <ellipse cx="120" cy="165" rx="5" ry="13" fill="#10c2cd" opacity="0.65"/>
      <ellipse cx="190" cy="150" rx="4.5" ry="12" fill="#f99e4c" opacity="0.65"/>
      <ellipse cx="280" cy="95" rx="6" ry="18" fill="#10c2cd" opacity="0.45"/>
      <ellipse cx="370" cy="105" rx="3.5" ry="11" fill="#f99e4c" opacity="0.4"/>
      <!-- Оранжевые акценты -->
      <rect x="145" y="130" width="20" height="8" rx="3" fill="#f99e4c" transform="rotate(-20 155 134)"/>
      <rect x="220" y="115" width="18" height="7" rx="3" fill="#f99e4c" transform="rotate(16 230 120)"/>
      <rect x="270" y="70" width="15" height="7" rx="3" fill="#f99e4c" transform="rotate(12 278 75)"/>
      <rect x="330" y="125" width="20" height="7" rx="3" fill="#f99e4c" transform="rotate(10 340 130)"/>
    </g>
    <!-- Градиент -->
    <defs>
      <linearGradient id="graffitiBlue" x1="70" y1="40" x2="390" y2="180" gradientUnits="userSpaceOnUse">
        <stop stop-color="#22d2ee"/>
        <stop offset="0.45" stop-color="#42c6f8"/>
        <stop offset="0.75" stop-color="#6049e7"/>
        <stop offset="1" stop-color="#ae38e7"/>
      </linearGradient>
    </defs>
</svg>

