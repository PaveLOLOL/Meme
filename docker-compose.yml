version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: rgy.tik.r314.ru/meme/frontend:${TAG}
    container_name: meme_front
    restart: unless-stopped
    platform: linux/amd64
    networks:
      - network
    ports:
      - "8081:8080"

networks:
  network:
    driver: bridge
